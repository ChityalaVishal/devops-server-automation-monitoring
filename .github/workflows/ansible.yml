
name: Ansible CI Pipeline

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  ansible-validation:
    name: Ansible Playbook Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Ansible
        run: pip install ansible-core==2.16.3

      - name: Check Ansible Version
        run: ansible --version

      - name: Validate Ansible Playbook
        run: ansible-playbook --syntax-check ansible/apache.yml
