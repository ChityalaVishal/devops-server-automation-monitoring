name: Puppet CI Pipeline

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  puppet-validation:
    name: Puppet Manifest Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Puppet
        run: |
          sudo apt-get update
          sudo apt-get install -y puppet

      - name: Check Puppet Version
        run: puppet --version

      - name: Validate Puppet Manifest
        run: puppet parser validate puppet/manifests/site.pp
